<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=1000">
    <title>Document</title>
    <link rel="stylesheet" href="studreg.css">
   
</head>
<body>
   <div class="card">
    <div class="left">
         <h1>Student Registration Portal</h1> <br>

           <h3>Register here!</h3>

   <form id="student">
    <label>Fullname</label>
    <input type="text" id="FullName"> <br>
    <label>Age</label>
    <input type="number" id="age"> <br>
    <label>Email</label>
    <input type="text" id="Email"> <br>
       <label>Class</label>
        <select id="class">
            <option>Select Class</option>
            <option>undergrad</option>
            <option>Postgrad</option>
            <option>Part-time</option>
        </select> <br>
    <button  type="submit" class="regbutton" id="regbtn">
       Register Student!
</button>
</form>
    </div>
    <div class="right">
          <button type="button"
    onclick="document.getElementById('info').style.display='block'">Show Info</button> <br>
    <p id="info" style="display:none"> We want to make it easy for our students, alumnae to<br>
        access information as securely and accurately as possible.</p>
        
    </div>
 
   </div>

    <script src="studreg.js"></script>
</body>
</html>
